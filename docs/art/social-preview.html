<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Device social preview</title>
<link rel="stylesheet" href="art.css">
<style>
  /* GitHub crops nothing but shows this small; keep text inside a 64 px margin. */
  .social { width: 1280px; height: 640px; }
  .social .text { position: absolute; left: 72px; top: 136px; width: 500px; display: flex; flex-direction: column; gap: 26px; }
  .social .wordmark { gap: 16px; }
  .social .wordmark b { font-size: 50px; }
  .social h1 { margin: 0; font-size: 52px; line-height: 1.08; font-weight: 700; letter-spacing: -0.03em; }
  .social p { margin: 0; font-size: 22px; line-height: 1.45; color: var(--text-2); }
  .social .chips { margin-top: 6px; }
  .social .window { position: absolute; left: 620px; top: 96px; width: 1000px; }
</style>
</head>
<body>
<div class="art square social">
  <div class="bars"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="ruler"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span><span>16</span></div>
  <div class="playhead" style="left: 599px"></div>
  <div class="text">
    <div class="wordmark"><img class="mark" src="mark.svg" width="60" height="60" alt=""><b>Device</b></div>
    <h1>Your studio.<br>No subscription.</h1>
    <p>A free, open-source DAW with a real-time C++ engine and a GPU-drawn interface.</p>
    <div class="chips">
      <span class="chip"><i style="background: var(--audio)"></i>macOS · Windows · Linux</span>
      <span class="chip"><i style="background: var(--accent)"></i>AGPL-3.0</span>
    </div>
  </div>
  <div class="window"><img src="shots/arrange.png" alt=""></div>
</div>
</body>
</html>
