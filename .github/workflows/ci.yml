name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# macOS runs on the self-hosted runner (one Apple silicon Mac mini, so real
# hardware with a real audio device). Windows and Linux run on GitHub-hosted
# runners (windows-latest, ubuntu-latest): no audio endpoint and no GPU there,
# so the engine's device tests skip and the app smoke tests use a software
# renderer. Platform-specific steps are gated on runner.os.
#
# Every action used here runs on Node 24 (checkout@v5, cache@v5) or is a
# composite/shell step (rust-toolchain, the MSVC environment step below).
jobs:
  build-test:
    name: build-test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
          - name: Linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
      # Speed: CI builds start from a restored target dir, never edit-compile
      # loops, so incremental data is dead weight (bigger cache, slower
      # builds). Line tables keep file:line in test backtraces.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Every C/C++ compile (the standalone engine build and the two the
      # engine build script runs, dev and release) goes through ccache, so an
      # unchanged engine file is compiled once and then served from the cache.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # the merge commit and its base, for the docs-only check
      # A pull request that changes only documentation skips the build and
      # tests: every later step checks steps.changes.outputs.skip. The jobs
      # still run (and pass), so the required build-test checks report.
      - name: Changed files
        id: changes
        shell: bash
        run: |
          skip=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "$files"
            # Anything outside these patterns needs the full run.
            if [ -n "$files" ] && ! echo "$files" | grep -qvE '\.md$|^docs/|^specs/|^\.agents/|^LICENSE|^\.github/ISSUE_TEMPLATE/|^\.github/dependabot\.yml$'; then
              skip=true
              echo "Only documentation changed: skipping the build and tests."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.skip != 'true'

      - name: Install build tools and system packages (Linux)
        if: runner.os == 'Linux' && steps.changes.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config ccache \
            xvfb mesa-vulkan-drivers \
            libpipewire-0.3-dev libasound2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev libudev-dev
      - name: Install Ninja and ccache (macOS)
        if: runner.os == 'macOS' && steps.changes.outputs.skip != 'true'
        run: brew install ninja ccache
      - name: Install ccache (Windows)
        if: runner.os == 'Windows' && steps.changes.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = '4.12.1'
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v$v/ccache-$v-windows-x86_64.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne '98AEA520D66905B8BA7A8E648A4CC0CA941D5E119D441F1E879A4A9045BF18F6') { throw "ccache zip checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "ccache-$v-windows-x86_64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows' && steps.changes.outputs.skip != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the C++ x64 tools" }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
      - name: Tool versions
        if: steps.changes.outputs.skip != 'true'
        shell: bash
        run: |
          cmake --version | head -1
          ninja --version
          ccache --version | head -1
          rustc --version
          if [ "$RUNNER_OS" = "Windows" ]; then cl 2>&1 | head -1; else c++ --version | head -1; fi

      # Self-hosted runners keep a cargo target dir and an SDK download dir per
      # runner outside the workspace (checkout wipes the workspace's ignored
      # files), so each runner keeps its own incremental build and nothing is
      # uploaded. Saving target/ to the GitHub cache took 26 minutes a run.
      # GitHub-hosted runners start empty, so they use the workspace and
      # actions/cache instead.
      - name: Build directories
        if: steps.changes.outputs.skip != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            target="$GITHUB_WORKSPACE/target"
            deps="$GITHUB_WORKSPACE/.deps"
          else
            base="$HOME/.cache/devicestudio-ci/$RUNNER_NAME"
            target="$base/target"
            deps="$base/deps"
          fi
          mkdir -p "$target" "$deps"
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
          echo "DSTUDIO_DEPS_DIR=$deps" >> "$GITHUB_ENV"
          echo "target: $target"
          echo "deps:   $deps"
      - name: Cache SDK downloads
        if: runner.environment == 'github-hosted' && steps.changes.outputs.skip != 'true'
        uses: actions/cache@v5
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('engine/CMakeLists.txt') }}
      # The cargo target dir (about 2 GB a system) and the ccache store are
      # restored on every run but saved only by pushes to main (the save steps
      # after the release build), under a new key each time. Pull requests then
      # always start from main's latest build, and their own saves no longer
      # fill the repository's 10 GB cache and evict main's.
      - name: Restore cargo registry and target
        if: runner.environment == 'github-hosted' && steps.changes.outputs.skip != 'true'
        id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            cargo-v2-${{ runner.os }}-
      - name: Restore ccache
        if: runner.environment == 'github-hosted' && steps.changes.outputs.skip != 'true'
        id: ccache-cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Reset ccache statistics
        if: steps.changes.outputs.skip != 'true'
        run: ccache --zero-stats
      # Only restored caches (hosted runners) can hold a CMakeCache.txt made
      # in another checkout; the per-runner dirs always build in place.
      - name: Drop CMake caches restored from another runner's checkout
        if: runner.os != 'Windows' && runner.environment == 'github-hosted' && steps.changes.outputs.skip != 'true'
        shell: bash
        run: |
          target=$(cd "$CARGO_TARGET_DIR" && pwd -P)
          deps=$(cd "$DSTUDIO_DEPS_DIR" && pwd -P)
          find "$target" "$deps" -name CMakeCache.txt > "$RUNNER_TEMP/cmake-caches.txt"
          while IFS= read -r cache; do
            [ -f "$cache" ] || continue
            here=$(cd "$(dirname "$cache")" && pwd -P)
            made=$(sed -n 's/^CMAKE_CACHEFILE_DIR:INTERNAL=//p' "$cache")
            if [ -d "$made" ]; then made=$(cd "$made" && pwd -P); fi
            [ "$made" = "$here" ] && continue
            case "$here" in
              "$target"/dstudio-third-party/*) stale="$target/dstudio-third-party" ;;
              "$deps"/*) stale="$deps" ;;
              *) stale="$here" ;;
            esac
            echo "Removing $stale (its CMakeCache.txt was made in $made)"
            rm -rf "$stale"
          done < "$RUNNER_TEMP/cmake-caches.txt"
      # The target dir (persistent or restored) can hold dstudio-engine's build-script output
      # (out/lib) and fingerprints saved from another commit; cargo would then
      # skip CMake and link that old engine library. Cleaning the package
      # forces build.rs (and so CMake) to run on every run. The shared
      # FetchContent tree in $CARGO_TARGET_DIR/dstudio-third-party is kept.
      - name: Force the engine build script to rerun
        if: steps.changes.outputs.skip != 'true'
        run: |
          cargo clean -p dstudio-engine --locked
          cargo clean -p dstudio-engine --release --locked

      - name: Engine — configure
        if: steps.changes.outputs.skip != 'true'
        run: cmake -S engine -B engine/build-ci -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DDSTUDIO_ENGINE_WERROR=ON "-DFETCHCONTENT_BASE_DIR=${{ env.DSTUDIO_DEPS_DIR }}"
      - name: Engine — build
        if: steps.changes.outputs.skip != 'true'
        run: cmake --build engine/build-ci -- -k 0
      - name: Engine — test
        if: steps.changes.outputs.skip != 'true'
        run: ctest --test-dir engine/build-ci --output-on-failure -j 4

      # The Rust steps run even when the engine tests failed (both results
      # are reported; the job still fails). cargo test compiles every crate
      # of the workspace, so there is no separate debug `cargo build`: it
      # compiled the app a second time for nothing (2 to 4.5 minutes a job).
      - name: Rust workspace — test
        if: steps.changes.outputs.skip != 'true' && !cancelled()
        run: cargo test --workspace --locked --no-fail-fast

      # App smoke tests without a GPU or audio device: a reference-state
      # screenshot and the scripted self-test (--no-audio), on a software
      # renderer (Linux: Xvfb + Mesa lavapipe Vulkan; Windows: WARP via DX12).
      # The self-test prints "self-test: P / N checks passed"; P must equal N
      # (skipped checks are not counted in N). Release build: the build users
      # run.
      - name: App — release build (smoke tests)
        if: steps.changes.outputs.skip != 'true' && !cancelled()
        run: cargo build --release -p dstudio-app --locked
      - name: ccache statistics
        if: steps.changes.outputs.skip != 'true' && !cancelled()
        run: ccache --show-stats
      # Saved before the smoke tests, so a hung self-test cannot lose them.
      - name: Save cargo registry and target
        if: github.event_name == 'push' && runner.environment == 'github-hosted' && steps.changes.outputs.skip != 'true' && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Save ccache
        if: github.event_name == 'push' && runner.environment == 'github-hosted' && steps.changes.outputs.skip != 'true' && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}
      - name: App — self-test (macOS)
        if: runner.os == 'macOS' && steps.changes.outputs.skip != 'true' && !cancelled()
        env:
          RUST_BACKTRACE: "1"
        run: |
          status=0
          "$CARGO_TARGET_DIR/release/device-studio" --self-test --no-audio > selftest-macos.txt 2> selftest-macos-stderr.txt || status=$?
          echo "self-test exit status: $status"
          grep -E "^(FAIL|SKIP)" selftest-macos.txt || true
          line=$(grep -E "^self-test: [0-9]+ / [0-9]+ checks passed" selftest-macos.txt) || { tail -30 selftest-macos-stderr.txt; exit 1; }
          echo "$line"
          [ "$(echo "$line" | sed -E 's#self-test: ([0-9]+) / ([0-9]+).*#\1#')" = "$(echo "$line" | sed -E 's#self-test: ([0-9]+) / ([0-9]+).*#\2#')" ]
          if [ "$status" -ne 0 ]; then tail -30 selftest-macos-stderr.txt; exit "$status"; fi
      - name: App — screenshot and self-test (Linux, Xvfb + lavapipe)
        if: runner.os == 'Linux' && steps.changes.outputs.skip != 'true' && !cancelled()
        env:
          WGPU_BACKEND: vulkan
          SLINT_WGPU_CPU: "1" # Slint refuses CPU adapters (lavapipe) unless allowed
          RUST_BACKTRACE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" "$CARGO_TARGET_DIR/release/device-studio" --state reference-default --screenshot app-linux.png
          test -s app-linux.png
          status=0
          xvfb-run -a -s "-screen 0 1600x1000x24" "$CARGO_TARGET_DIR/release/device-studio" --self-test --no-audio > selftest-linux.txt 2> selftest-linux-stderr.txt || status=$?
          echo "self-test exit status: $status"
          grep -E "^(FAIL|SKIP)" selftest-linux.txt || true
          line=$(grep -E "^self-test: [0-9]+ / [0-9]+ checks passed" selftest-linux.txt) || { tail -30 selftest-linux-stderr.txt; exit 1; }
          echo "$line"
          [ "$(echo "$line" | sed -E 's#self-test: ([0-9]+) / ([0-9]+).*#\1#')" = "$(echo "$line" | sed -E 's#self-test: ([0-9]+) / ([0-9]+).*#\2#')" ]
          if [ "$status" -ne 0 ]; then tail -30 selftest-linux-stderr.txt; exit "$status"; fi
      # Windows smoke tests are informational (continue-on-error): see the
      # exit codes they print.
      - name: App — screenshot (Windows, WARP)
        if: runner.os == 'Windows' && steps.changes.outputs.skip != 'true' && !cancelled()
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        env:
          WGPU_BACKEND: dx12
          SLINT_WGPU_CPU: "1" # Slint refuses CPU adapters (WARP) unless allowed
          RUST_BACKTRACE: "1"
        run: |
          $exe = Join-Path $env:CARGO_TARGET_DIR "release\device-studio.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--state','reference-default','--screenshot','app-windows.png' -NoNewWindow -Wait -PassThru -RedirectStandardError shot-windows-stderr.txt
          Get-Content shot-windows-stderr.txt
          "screenshot run exit code: 0x{0:X8}" -f $p.ExitCode
          if (-not (Test-Path app-windows.png)) { throw "no screenshot" }
      # The full self-test under WARP runs until the 30-minute timeout on
      # every run at the moment (frames back up on the software renderer), so
      # it held every pull request's Windows check for half an hour without a
      # result. It runs on pushes to main, and on a pull request only when the
      # pull request has the `windows-self-test` label (add the label, then
      # push).
      - name: App — self-test (Windows, WARP)
        if: >-
          runner.os == 'Windows' && steps.changes.outputs.skip != 'true' && !cancelled() &&
          (github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'windows-self-test'))
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        env:
          WGPU_BACKEND: dx12
          SLINT_WGPU_CPU: "1"
          RUST_BACKTRACE: "1"
        run: |
          $exe = Join-Path $env:CARGO_TARGET_DIR "release\device-studio.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test','--no-audio' -NoNewWindow -Wait -PassThru -RedirectStandardOutput selftest-windows.txt -RedirectStandardError selftest-windows-stderr.txt
          "self-test exit code: 0x{0:X8}" -f $p.ExitCode
          Select-String -Path selftest-windows.txt -Pattern '^(FAIL|SKIP)' | ForEach-Object { $_.Line }
          $line = (Select-String -Path selftest-windows.txt -Pattern '^self-test: (\d+) / (\d+) checks passed').Matches | Select-Object -First 1
          if (-not $line) { Get-Content selftest-windows-stderr.txt -Tail 30; throw "no self-test summary" }
          $line.Value
          if ($line.Groups[1].Value -ne $line.Groups[2].Value) { throw "self-test failures" }
      - name: Upload app screenshots and self-test logs
        if: steps.changes.outputs.skip != 'true' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ runner.os }}
          path: |
            app-*.png
            selftest-*.txt
            shot-*.txt
          if-no-files-found: ignore
