name: Release

# Builds the installable packages and, for a version tag, publishes them as a draft
# GitHub release:
#   macOS    DeviceStudio-<version>-macos-universal.dmg      (Apple silicon + Intel)
#   Windows  DeviceStudio-<version>-windows-x64-setup.exe    (installer)
#            DeviceStudio-<version>-windows-x64.zip          (portable)
#   Linux    DeviceStudio-<version>-linux-x86_64.tar.gz
#            DeviceStudio-<version>-linux-aarch64.tar.gz
#
# Releasing: set `version` in the root Cargo.toml to X.Y.Z, merge that to main, then push
# the tag vX.Y.Z on that commit. The tag must be on main and match Cargo.toml, or nothing
# builds. The release is created as a draft with generated notes; review the packages and
# publish it by hand.
#
# Other runs build the packages without releasing anything (download them from the run's
# artifacts):
#   - Actions > Release > Run workflow, from any branch;
#   - pull requests that change the packaging (this file, tools/release/, the bundle script).
#
# Signing: the macOS app is signed and notarised when these repository secrets exist:
# MACOS_CERTIFICATE (base64 .p12 of a Developer ID Application certificate),
# MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID and
# APPLE_APP_PASSWORD (an app-specific password). Without them it is signed ad hoc. The
# Windows packages are not signed yet.

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'tools/release/**'
      - 'tools/macos-bundle.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tag's ancestry is checked against main
      - id: v
        name: Version from Cargo.toml (and the tag)
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $version"
              exit 1
            fi
            git fetch --no-tags origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "::error::tag $GITHUB_REF_NAME is not on main; releases are built from main only"
              exit 1
            fi
          else
            # Not a release: mark the packages as a development build of this commit.
            version="$version-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  macos:
    name: Package macOS (universal)
    needs: version
    runs-on: macos-15
    env:
      HAS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Install Ninja
        run: brew install ninja
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      # The engine's C++ is built by build.rs (CMake). Each target gets its own build, so the
      # x86_64 engine is cross-compiled on this Apple silicon runner.
      - name: Build (Apple silicon)
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: cargo build --release --locked -p dstudio-app --target aarch64-apple-darwin
      - name: Build (Intel)
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          CMAKE_OSX_ARCHITECTURES: x86_64
        run: cargo build --release --locked -p dstudio-app --target x86_64-apple-darwin
      - name: Import the signing certificate
        id: cert
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Package .dmg
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.cert.outcome == 'success' && secrets.MACOS_SIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash tools/release/package-macos.sh "${{ needs.version.outputs.version }}" dist
      - name: Smoke test (the packaged app starts and renders)
        run: |
          set -euo pipefail
          mnt=$(hdiutil attach -nobrowse -readonly dist/*.dmg | sed -n 's#.*\(/Volumes/.*\)#\1#p' | tail -1)
          app="$mnt/Device Studio.app/Contents/MacOS"
          test -x "$app/dstudio_plugin_scanner"
          "$app/device-studio" --state reference-default --screenshot "$RUNNER_TEMP/macos.png"
          test -s "$RUNNER_TEMP/macos.png"
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@v7
        with:
          name: package-macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Package Windows (x64)
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: MSVC developer environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the C++ x64 tools" }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: cargo build --release --locked -p dstudio-app
      - name: Package installer and .zip
        shell: pwsh
        run: pwsh tools/release/package-windows.ps1 -Version "${{ needs.version.outputs.version }}" -OutDir dist
      - name: Smoke test (the installer installs, the app starts)
        shell: pwsh
        env:
          WGPU_BACKEND: dx12
          SLINT_WGPU_CPU: '1' # WARP: no GPU on the runner
        run: |
          $setup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'DeviceStudio'
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          foreach ($f in 'device-studio.exe', 'dstudio_plugin_scanner.exe', 'vcruntime140.dll') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f not installed" }
          }
          $shot = Join-Path $env:RUNNER_TEMP 'windows.png'
          $p = Start-Process -FilePath (Join-Path $dir 'device-studio.exe') -ArgumentList '--state', 'reference-default', '--screenshot', $shot -NoNewWindow -Wait -PassThru
          "exit code: 0x{0:X8}" -f $p.ExitCode
          if (-not (Test-Path $shot)) { throw "the installed app did not render" }
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  linux:
    name: Package Linux (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config \
            libpipewire-0.3-dev libasound2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev libudev-dev
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-cargo-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: cargo build --release --locked -p dstudio-app
      - name: Package .tar.gz
        run: bash tools/release/package-linux.sh "${{ needs.version.outputs.version }}" ${{ matrix.arch }} dist
      - name: Smoke test (install from the archive, the app starts and renders)
        env:
          WGPU_BACKEND: vulkan
          SLINT_WGPU_CPU: '1' # lavapipe: no GPU on the runner
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers
          mkdir -p "$RUNNER_TEMP/unpack"
          tar -C "$RUNNER_TEMP/unpack" -xzf dist/*.tar.gz
          "$RUNNER_TEMP"/unpack/*/install.sh "$RUNNER_TEMP/prefix"
          test -x "$RUNNER_TEMP/prefix/lib/device-studio/dstudio_plugin_scanner"
          xvfb-run -a -s "-screen 0 1600x1000x24" "$RUNNER_TEMP/prefix/bin/device-studio" \
            --state reference-default --screenshot "$RUNNER_TEMP/linux.png"
          test -s "$RUNNER_TEMP/linux.png"
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Draft release
    needs: [version, macos, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the packages
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: package-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Device Studio ${{ needs.version.outputs.version }}" \
            --generate-notes \
            --verify-tag
