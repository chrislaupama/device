name: Performance

# Benchmark regression checks (tools/perf/bench_gate.py). Builds the engine and core
# benchmarks twice on the same runner, at the base commit and with the change, runs both and
# compares them row by row:
#
#   Instructions (Linux): every benchmark under Valgrind's Callgrind, which counts the CPU
#     instructions behind each printed row, all engine threads included. The counts repeat
#     almost exactly between runs, so the limit is tight: a row more than 1 % above the
#     base fails the check. This is the gate.
#   Time (Linux, macOS, Windows): the benchmarks natively, base and head interleaved over
#     three rounds, fastest round per row. Hosted runners are shared machines, so a row more
#     than 15 % slower (re-timed with more rounds first) is reported as a warning only, and so
#     is a comparison that fails or times out (a flaky runner does not turn these jobs red). It
#     catches what instruction counts cannot see: cache misses, denormals, thread hand-offs,
#     platform-specific code.
#
# Both write their table to the run's summary page and upload it as an artifact.
# A regression that is worth it (more work for a new feature, say) is accepted by adding the
# `perf-regression-accepted` label to the pull request: the check passes and the report still
# lists it. A benchmark that cannot be measured with the change fails even with the label.
# On pushes to main each commit is compared with the one before it.
#
# Locally: python3 tools/perf/bench_gate.py all --base origin/main

#
# The Callgrind job is a required check on main, so it has to report on every pull request:
# pull requests run this workflow whatever they change, and the `changes` job skips both
# comparisons when nothing they measure changed (a skipped job counts as passed). Pushes to
# main keep their path filter.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'crates/dstudio-core/**'
      - 'Cargo.lock'
      - 'tools/perf/**'
      - '.github/workflows/perf.yml'
  workflow_dispatch:
    inputs:
      base:
        description: 'Commit, branch or tag to compare against'
        default: 'origin/main'

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The commit to compare against: the PR's base, the previous main commit, or the input.
  BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base || github.event.before }}
  PERF_ACCEPT: ${{ contains(github.event.pull_request.labels.*.name, 'perf-regression-accepted') && '1' || '' }}

jobs:
  changes:
    name: Benchmarked code changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      perf: ${{ steps.changes.outputs.perf }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Paths the benchmarks depend on
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Pushes and manual runs always compare. A pull request compares when it touches
          # what the benchmarks build, or when the diff can't be read.
          perf=true
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only "$BASE_REF" HEAD); then
            if ! printf '%s\n' "$files" | grep -qE '^(engine/|crates/dstudio-core/|Cargo\.lock$|tools/perf/|\.github/workflows/perf\.yml$)'; then
              perf=false
            fi
          fi
          echo "perf=$perf" | tee -a "$GITHUB_OUTPUT"

  instructions:
    name: Instructions (Linux, Callgrind)
    needs: changes
    # Skipped (which counts as passed) only when the changes job said so; if it failed, compare anyway.
    if: ${{ !cancelled() && needs.changes.outputs.perf != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the base commit is built from a worktree
      - name: Rust toolchain (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install build tools and Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config ccache valgrind \
            libpipewire-0.3-dev libasound2-dev libx11-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            .perf-deps
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: perf-instructions-${{ github.sha }}
          restore-keys: perf-instructions-
      - name: Compare with the base
        run: python3 tools/perf/bench_gate.py all --base "$BASE_REF" --mode instructions --work build/perf --deps .perf-deps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: perf-instructions
          path: |
            build/perf/report.md
            build/perf/instructions-*.json
            build/perf/*/*.log
          if-no-files-found: ignore

  time:
    name: Time (${{ matrix.name }})
    needs: changes
    # Adding or removing the accept label only matters to the gate above.
    if: ${{ !cancelled() && needs.changes.outputs.perf != 'false' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: macOS, os: macos-15 }
          - { name: Windows, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    # Setup (tools, caches) plus the 75-minute comparison, with room left for the warning step.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust toolchain (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config ccache libpipewire-0.3-dev libasound2-dev libx11-dev
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache
      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the C++ x64 tools" }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/Library/Caches/ccache
            .perf-deps
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: perf-time-${{ runner.os }}-${{ github.sha }}
          restore-keys: perf-time-${{ runner.os }}-
      # A failed or timed-out comparison does not fail the job: a slow shared runner or a benchmark
      # that cannot run on one OS is reported as a warning below. The step timeout leaves time in
      # the job for that warning. Setup steps above (installing tools) can still fail the job. The Callgrind job above still fails
      # on a benchmark it cannot measure, and the CI build-test jobs catch build breaks.
      - name: Compare with the base
        id: compare
        if: runner.os != 'Windows'
        continue-on-error: true
        timeout-minutes: 75
        run: python3 tools/perf/bench_gate.py all --base "$BASE_REF" --mode time --work build/perf --deps .perf-deps
      # PowerShell, not bash: Git's bash puts its own link.exe ahead of MSVC's on PATH.
      - name: Compare with the base (Windows)
        id: compare_windows
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 75
        shell: pwsh
        run: python tools/perf/bench_gate.py all --base "$env:BASE_REF" --mode time --work build/perf --deps .perf-deps
      - name: Warn about slower rows
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if grep -q "row(s) over the limit" build/perf/report.md 2>/dev/null; then
            echo "::warning title=Benchmarks slower on ${{ matrix.name }}::$(grep 'row(s) over the limit' build/perf/report.md | head -1) See the run summary."
          fi
          # A benchmark that crashed on one side is only a note in the time report.
          if grep -q '` failed: base ' build/perf/report.md 2>/dev/null; then
            echo "::warning title=Benchmark failed on ${{ matrix.name }}::$(grep '` failed: base ' build/perf/report.md | head -1 | tr -d '`') See the run summary."
          fi
      - name: Warn if the timing run failed
        if: ${{ !cancelled() && (steps.compare.outcome == 'failure' || steps.compare_windows.outcome == 'failure') }}
        shell: bash
        run: |
          msg="The timing comparison did not finish on ${{ matrix.name }} (a build or benchmark failed, or the runner timed out). This is a warning only; see the step log."
          echo "::warning title=Timing run failed on ${{ matrix.name }}::$msg"
          echo "**Timing run failed on ${{ matrix.name }}**: $msg" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: perf-time-${{ matrix.name }}
          path: |
            build/perf/report.md
            build/perf/time-*.json
            build/perf/*/*.log
          if-no-files-found: ignore
