name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the demo project (`--demo`)
        2. ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit and system version
      description: The commit you built (`git rev-parse --short HEAD`) and your OS version, audio interface and plugin, if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or a project
      description: Terminal output, a crash log, a screenshot, or a small project that shows the problem.
      render: text
