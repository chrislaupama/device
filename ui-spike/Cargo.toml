[package]
name = "ui-spike"
version = "0.1.0"
edition = "2024"
publish = false
description = "Saine Studio UI rendering spike: Slint shell + custom wgpu timeline/meters"

# Standalone workspace: intentionally not part of any parent workspace.
[workspace]

[dependencies]
# Exact pins: Slint's wgpu interop is behind `unstable-wgpu-30` and is tied to a wgpu major.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-30",
    "compat-1-2",
    "accessibility",
] }
wgpu = { version = "=30.0.1" }
bytemuck = { version = "=1.24.0", features = ["derive"] }
png = "=0.18.1"
pollster = "=0.4.0"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
debug = 1
