[workspace]
resolver = "3"
members = ["crates/dstudio-core", "crates/dstudio-engine", "crates/dstudio-app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-or-later"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[profile.release]
debug = 1
