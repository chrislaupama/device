[package]
name = "dstudio-app"
description = "Device desktop application (Slint shell + custom wgpu timeline)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "device-studio"
path = "src/main.rs"

[dependencies]
dstudio-core = { path = "../dstudio-core" }
dstudio-engine = { path = "../dstudio-engine" }
# Exact pins: Slint's wgpu interop is behind `unstable-wgpu-30` and is tied to a
# wgpu major (see docs/adr/0001-ui-rendering.md). `unstable-winit-030` is only
# used for the macOS transparent-titlebar window attributes hook.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-30",
    "unstable-winit-030",
    "compat-1-2",
    "accessibility",
] }
wgpu = { version = "=30.0.1" }
bytemuck = { version = "=1.24.0", features = ["derive"] }
png = "=0.18.1"
pollster = "=0.4.0"
rfd = "0.15"
ureq = { version = "3", features = ["json"] }
flate2 = "1.1"
# Already in the tree; local date and time for Edit › Undo History.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
roxmltree = "0.21"
serde_json.workspace = true
serde.workspace = true

# Already in the tree through winit/muda; used to turn off the menu items AppKit adds to Edit and View.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSUserDefaults", "NSDictionary", "NSString", "NSValue"] }

[build-dependencies]
slint-build = "=1.18.1"
