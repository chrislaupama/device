[package]
name = "saine-app"
description = "Saine Studio desktop application (Slint shell + custom wgpu timeline)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "saine-studio"
path = "src/main.rs"

[dependencies]
saine-core = { path = "../saine-core" }
saine-engine = { path = "../saine-engine" }
# Exact pins: Slint's wgpu interop is behind `unstable-wgpu-30` and is tied to a
# wgpu major (see docs/adr/0001-ui-rendering.md). `unstable-winit-030` is only
# used for the macOS transparent-titlebar window attributes hook.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-30",
    "unstable-winit-030",
    "compat-1-2",
    "accessibility",
] }
wgpu = { version = "=30.0.1" }
bytemuck = { version = "=1.24.0", features = ["derive"] }
png = "=0.18.1"
pollster = "=0.4.0"
rfd = "0.15"

[build-dependencies]
slint-build = "=1.18.1"
